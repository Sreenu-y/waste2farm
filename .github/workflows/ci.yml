name: Waste2Farm CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Dependencies
        run: |
          for dir in services/auth-service services/waste-service services/order-service services/logistics-service services/payment-service services/analytics-service services/notification-service services/api-gateway; do
            cd $dir && npm install && cd ../..
          done
      - name: Seed Test Data
        env:
          MONGO_URI: mongodb://localhost:27017/waste2farm_test
        run: node scripts/seed.js

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Images
        run: |
          for service in auth-service waste-service order-service logistics-service payment-service analytics-service notification-service api-gateway; do
            docker build -t waste2farm/$service:${{ github.sha }} ./services/$service
          done
      - name: Push to Registry
        run: echo "Push to ECR/DockerHub in production"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Deploy to AWS ECS/EKS in production"
